<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emfuleni Gymnastics</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
      position: relative;
    }

    /* soft watermark */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("logo.png") center center / 40% no-repeat;
      opacity: 0.05;
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    /* ================= HEADER ================= */
    .top-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .top-logo {
      max-width: 260px;
      width: 80%;
      height: auto;
      margin-bottom: 10px;
    }

    .top-header h1 {
      margin: 0;
      font-size: 26px;
    }

    .top-header p {
      margin: 5px 0 0 0;
      font-size: 14px;
      color: #555;
    }

    /* ================= TITLE ================= */
    .title {
      text-align: center;
      margin-bottom: 25px;
    }

    .title h1 {
      margin: 0;
      font-size: 30px;
    }

    /* ================= MENU ================= */
    .menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .menu button {
      padding: 18px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      background: #1f6feb;
      color: white;
      cursor: pointer;
      width: 100%;
    }

    .menu button:hover {
      background: #174ea6;
    }

    @media (max-width: 640px) {
      .top-logo {
        max-width: 200px;
      }

      .title h1 {
        font-size: 26px;
      }

      .menu button {
        font-size: 18px;
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="page-wrap">

    <!-- LOGO TOP CENTER -->
    <div class="top-header">
      <img src="logo.png" class="top-logo" alt="Emfuleni Gymnastics">
      <h1>Emfuleni Gymnastics</h1>
      <p>Judging System</p>
    </div>

    
    <!-- MENU -->
    <div class="menu">
      <button onclick="go('new-event.html')">New Event</button>
      <button onclick="go('registration.html')">Registration</button>
      <button onclick="go('landing.html')">Score</button>
      <button onclick="go('scoreboard.html')">Score Board</button>
      <button onclick="go('admin.html')">Admin</button>
    </div>

  </div>

  <script>
    function go(page) {
      window.location.href = page;
    }
  </script>

</body>
</html>
