<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- iPad magic -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Score Display</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .screen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .score {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 22vw;
      text-align: center;
    }

    .enter-bar {
      height: 60px;
      background: #2f6fe4;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      letter-spacing: 2px;
      cursor: pointer;
      user-select: none;
    }

    .enter-bar:active {
      background: #1e4fb3;
    }
  </style>
</head>

<body>

  <div class="screen">
    <div id="score" class="score">0.00</div>

    <div class="enter-bar" onclick="nextScore()">
      ENTER
    </div>
  </div>

  <script src="display.js"></script>

</body>
</html>
