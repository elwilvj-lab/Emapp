<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Display Score</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .score-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #score {
      color: #fff;
      font-weight: bold;
      line-height: 1;
      font-size: 38vw; /* MAX BIG */
      text-align: center;
      user-select: none;
    }

    .bottom-bar {
      height: 60px;
      display: flex;
    }

    .enter-btn {
      width: 100%;
      border: none;
      background: #1f6feb;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="score-wrap">
    <div id="score">0.00</div>
  </div>

  <div class="bottom-bar">
    <button class="enter-btn" onclick="next()">ENTER</button>
  </div>

  <script src="display.js"></script>
</body>
</html>
