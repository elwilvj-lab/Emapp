<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Allow zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Score Display</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .score {
      color: white;
      font-weight: bold;
      font-size: 20vw; /* scales automatically */
      text-align: center;
      line-height: 1;
    }
  </style>
</head>

<body>

  <div class="screen">
    <div id="score" class="score">0.00</div>
  </div>

  <script src="display.js"></script>
</body>
</html>
